<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Credit Card Approval Prediction{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="{{ url_for('index') }}" aria-label="Credit Card Approval home">
        <span class="brand-mark">CC</span>
        <span>
          <span class="brand-name">Approval Desk</span>
          <span class="brand-subtitle">Credit card screening system</span>
        </span>
      </a>
      <nav class="top-nav" aria-label="Primary navigation">
        <a href="{{ url_for('health') }}">Health</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
